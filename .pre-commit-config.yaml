repos:
-  repo: https://github.com/charliermarsh/ruff-pre-commit
   rev: v0.15.14
   hooks:
     # Run the linter.
     - id: ruff
       args: ['--fix']
     # Run the formatter.
     - id: ruff-format
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
    - id: bandit
      args: ['-c', 'pyproject.toml', '--recursive']
      additional_dependencies: ['bandit[toml]']
